<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CCAT Questions</title>
  <style>
    :root {
      --blue: #3b45c8;
      --blue-dark: #283096;
      --ink: #202124;
      --muted: #71757f;
      --line: #d9dce7;
      --paper: #ffffff;
      --bg: #f2f4fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Aptos", "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 32px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 700;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .timer {
      min-width: 84px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--blue-dark);
      text-align: center;
      font-size: 16px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .timer.low {
      color: #a11e1e;
      border-color: #d9a2a2;
      background: #fff5f5;
    }

    .link {
      color: var(--blue-dark);
      font-size: 14px;
      text-decoration: none;
      font-weight: 700;
    }

    .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow: 0 18px 55px rgba(38, 44, 80, .10);
      overflow: hidden;
    }

    .progress-wrap {
      padding: 18px 22px 10px;
      border-bottom: 1px solid var(--line);
    }

    .progress {
      height: 12px;
      background: #e4e6f2;
      overflow: hidden;
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--blue);
      transition: width .18s ease;
    }

    .meta {
      margin-top: 8px;
      font-size: 14px;
      color: var(--muted);
    }

    .viewer {
      position: relative;
      padding: 20px 22px 22px;
    }

    .image-shell {
      min-height: 62vh;
      display: grid;
      place-items: center;
      background: #f8f9fd;
      border: 1px solid var(--line);
    }

    img {
      display: block;
      width: 100%;
      max-height: 76vh;
      object-fit: contain;
      background: #fff;
    }

    .missing {
      display: none;
      padding: 48px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 18px;
      font-weight: 700;
    }

    .controls {
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      gap: 14px;
      margin-top: 16px;
    }

    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      min-height: 44px;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }

    button:hover:not(:disabled),
    .chip:hover:not(.disabled) {
      border-color: var(--blue);
      color: var(--blue-dark);
    }

    button:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }

    .chip {
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      display: inline-grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    .chip.answered {
      box-shadow: inset 0 -4px 0 rgba(59, 69, 200, .22);
    }

    .chip.correct {
      background: #eef9f0;
      border-color: #63a76d;
      color: #25612d;
    }

    .chip.wrong {
      background: #fff1f1;
      border-color: #cc6b6b;
      color: #8a2525;
    }

    .chip.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .chip.disabled {
      background: #eef0f7;
      color: #a3a7b3;
      cursor: not-allowed;
    }

    .answer-bar {
      border: 1px solid var(--line);
      background: #f8f9fd;
      padding: 14px;
      margin-top: 16px;
    }

    .answer-label {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(5, minmax(44px, 1fr));
      gap: 8px;
    }

    .option {
      min-height: 46px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .option.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .finish-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .small-button,
    .finish-button {
      min-height: 40px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 800;
    }

    .finish-button {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .score-panel {
      display: none;
      border-top: 1px solid var(--line);
      padding: 20px 22px 22px;
      background: #fff;
    }

    .score-panel.visible {
      display: block;
    }

    .score-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .score-title {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
    }

    .score-meta {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 8px;
    }

    .result-item {
      border: 1px solid var(--line);
      background: #f8f9fd;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .result-item.correct {
      border-color: #63a76d;
      background: #eef9f0;
      color: #25612d;
    }

    .result-item.wrong {
      border-color: #cc6b6b;
      background: #fff1f1;
      color: #8a2525;
    }

    .result-item.missing,
    .result-item.unanswered {
      color: var(--muted);
    }

    @media (max-width: 720px) {
      .app {
        width: min(100% - 18px, 1180px);
        padding-top: 10px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .top-actions {
        width: 100%;
        justify-content: space-between;
      }

      .progress-wrap,
      .viewer {
        padding-left: 12px;
        padding-right: 12px;
      }

      .controls {
        grid-template-columns: 42px 1fr 42px;
        gap: 8px;
      }

      .chip {
        width: 28px;
        height: 28px;
        font-size: 11px;
      }

      .options {
        grid-template-columns: repeat(5, 1fr);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <h1>CCAT Questions</h1>
      <div class="top-actions">
        <div class="timer" id="timer">15:00</div>
        <button class="small-button" id="reset" type="button">Reset</button>
        <a class="link" href="answers.html">Open answers</a>
      </div>
    </div>

    <section class="panel" aria-label="Question viewer">
      <div class="progress-wrap">
        <div class="progress" aria-hidden="true"><span id="progress"></span></div>
        <div class="meta" id="meta">Question 9 / 50</div>
      </div>

      <div class="viewer">
        <div class="image-shell">
          <img id="questionImage" alt="Question screenshot">
          <div class="missing" id="missing">No image saved for this question.</div>
        </div>

        <div class="answer-bar" aria-label="Answer selector">
          <p class="answer-label">Your answer</p>
          <div class="options" id="options"></div>
          <div class="finish-row">
            <button class="finish-button" id="finish" type="button">Finish and score</button>
          </div>
        </div>

        <div class="controls">
          <button id="prev" type="button" aria-label="Previous question">&lt;</button>
          <div class="chips" id="chips" aria-label="Question numbers"></div>
          <button id="next" type="button" aria-label="Next question">&gt;</button>
        </div>
      </div>

      <div class="score-panel" id="scorePanel" aria-live="polite">
        <div class="score-head">
          <div>
            <p class="score-title" id="scoreTitle">Score</p>
            <p class="score-meta" id="scoreMeta"></p>
          </div>
          <button class="small-button" id="hideScore" type="button">Hide score</button>
        </div>
        <div class="result-grid" id="resultGrid"></div>
      </div>
    </section>
  </main>

  <script>
    const total = 50;
    const available = new Set(Array.from({ length: 42 }, (_, i) => i + 9));
    const labels = ["A", "B", "C", "D", "E"];
    const testMinutes = 15;
    let current = Number(new URLSearchParams(location.search).get("q")) || 9;
    let finished = localStorage.getItem("ccat-finished") === "true";
    let timerId = null;

    const img = document.getElementById("questionImage");
    const missing = document.getElementById("missing");
    const meta = document.getElementById("meta");
    const progress = document.getElementById("progress");
    const chips = document.getElementById("chips");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    const options = document.getElementById("options");
    const finish = document.getElementById("finish");
    const reset = document.getElementById("reset");
    const timer = document.getElementById("timer");
    const scorePanel = document.getElementById("scorePanel");
    const scoreTitle = document.getElementById("scoreTitle");
    const scoreMeta = document.getElementById("scoreMeta");
    const resultGrid = document.getElementById("resultGrid");
    const hideScore = document.getElementById("hideScore");

    function fileName(n) {
      return `${String(n).padStart(2, "0")}.JPG`;
    }

    function responseKey(n) {
      return `ccat-response-${n}`;
    }

    function answerKey(n) {
      return `ccat-key-${n}`;
    }

    function responseFor(n) {
      return localStorage.getItem(responseKey(n)) || "";
    }

    function correctFor(n) {
      return localStorage.getItem(answerKey(n)) || "";
    }

    function saveResponse(value) {
      localStorage.setItem(responseKey(current), value);
      render();
    }

    function startTime() {
      let startedAt = Number(localStorage.getItem("ccat-started-at"));
      if (!startedAt) {
        startedAt = Date.now();
        localStorage.setItem("ccat-started-at", String(startedAt));
      }
      return startedAt;
    }

    function formatTime(ms) {
      const safe = Math.max(0, ms);
      const minutes = Math.floor(safe / 60000);
      const seconds = Math.floor((safe % 60000) / 1000);
      return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    function updateTimer() {
      const endsAt = startTime() + testMinutes * 60 * 1000;
      const remaining = endsAt - Date.now();
      timer.textContent = formatTime(remaining);
      timer.classList.toggle("low", remaining <= 60000);
      if (remaining <= 0 && !finished) {
        finishTest();
      }
    }

    function nearestAvailable(n, direction = 1) {
      if (available.has(n)) return n;
      let cursor = n;
      while (cursor >= 1 && cursor <= total) {
        cursor += direction;
        if (available.has(cursor)) return cursor;
      }
      cursor = n;
      while (cursor >= 1 && cursor <= total) {
        cursor -= direction;
        if (available.has(cursor)) return cursor;
      }
      return 9;
    }

    function go(n) {
      current = nearestAvailable(Math.min(total, Math.max(1, n)), n >= current ? 1 : -1);
      const url = new URL(location.href);
      url.searchParams.set("q", current);
      history.replaceState(null, "", url);
      render();
    }

    function scoreFor(n) {
      const selected = responseFor(n);
      const correct = correctFor(n);
      if (!correct) return "missing";
      if (!selected) return "unanswered";
      return selected === correct ? "correct" : "wrong";
    }

    function renderChips() {
      chips.innerHTML = "";
      for (let n = 1; n <= total; n += 1) {
        const chip = document.createElement("button");
        chip.type = "button";
        const answered = responseFor(n) ? " answered" : "";
        const scored = finished && available.has(n) ? ` ${scoreFor(n)}` : "";
        chip.className = `chip${n === current ? " active" : ""}${available.has(n) ? answered + scored : " disabled"}`;
        chip.textContent = n;
        chip.disabled = !available.has(n);
        chip.setAttribute("aria-label", available.has(n) ? `Question ${n}` : `Question ${n} missing`);
        chip.addEventListener("click", () => go(n));
        chips.appendChild(chip);
      }
    }

    function renderOptions() {
      const selected = responseFor(current);
      options.innerHTML = "";
      labels.forEach((label) => {
        const option = document.createElement("button");
        option.type = "button";
        option.className = `option${selected === label ? " active" : ""}`;
        option.textContent = label;
        option.setAttribute("aria-label", `Select answer ${label}`);
        option.addEventListener("click", () => saveResponse(label));
        options.appendChild(option);
      });
    }

    function render() {
      current = nearestAvailable(current);
      meta.textContent = `Question ${current} / ${total}`;
      progress.style.width = `${(current / total) * 100}%`;
      prev.disabled = current <= 9;
      next.disabled = current >= 50;
      missing.style.display = "none";
      img.style.display = "block";
      img.src = fileName(current);
      img.alt = `Question ${current} screenshot`;
      renderOptions();
      renderChips();
      if (finished) renderScore();
    }

    function finishTest() {
      finished = true;
      localStorage.setItem("ccat-finished", "true");
      render();
      scorePanel.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function renderScore() {
      const questions = Array.from(available);
      const keyed = questions.filter((n) => correctFor(n));
      const correct = keyed.filter((n) => scoreFor(n) === "correct");
      const wrong = keyed.filter((n) => scoreFor(n) === "wrong");
      const unanswered = keyed.filter((n) => scoreFor(n) === "unanswered");
      const missing = questions.filter((n) => !correctFor(n));
      const percent = keyed.length ? Math.round((correct.length / keyed.length) * 100) : 0;

      scorePanel.classList.add("visible");
      scoreTitle.textContent = keyed.length ? `${correct.length} / ${keyed.length} correct (${percent}%)` : "No answer key yet";
      scoreMeta.textContent = `${wrong.length} wrong, ${unanswered.length} unanswered, ${missing.length} missing answer keys`;
      resultGrid.innerHTML = "";

      questions.forEach((n) => {
        const selected = responseFor(n) || "-";
        const correctAnswer = correctFor(n) || "-";
        const state = scoreFor(n);
        const item = document.createElement("button");
        item.type = "button";
        item.className = `result-item ${state}`;
        item.textContent = `Q${n}: ${selected} / ${correctAnswer}`;
        item.title = state === "correct" ? "Right" : state === "wrong" ? "Wrong" : state === "unanswered" ? "Unanswered" : "No answer key";
        item.addEventListener("click", () => go(n));
        resultGrid.appendChild(item);
      });
    }

    img.addEventListener("error", () => {
      img.style.display = "none";
      missing.style.display = "block";
    });

    prev.addEventListener("click", () => go(current - 1));
    next.addEventListener("click", () => go(current + 1));
    finish.addEventListener("click", finishTest);
    hideScore.addEventListener("click", () => scorePanel.classList.remove("visible"));
    reset.addEventListener("click", () => {
      if (!confirm("Reset timer and your selected answers?")) return;
      Array.from(available).forEach((n) => localStorage.removeItem(responseKey(n)));
      localStorage.removeItem("ccat-started-at");
      localStorage.removeItem("ccat-finished");
      finished = false;
      current = 9;
      scorePanel.classList.remove("visible");
      render();
      updateTimer();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") go(current - 1);
      if (event.key === "ArrowRight") go(current + 1);
    });

    render();
    updateTimer();
    timerId = setInterval(updateTimer, 1000);
  </script>
</body>
</html>
